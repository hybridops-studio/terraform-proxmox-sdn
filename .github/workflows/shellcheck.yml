name: ShellCheck

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_ARCHIVE: shellcheck-v0.11.0.linux.x86_64.tar.gz

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${SHELLCHECK_ARCHIVE}" \
            -o "${SHELLCHECK_ARCHIVE}"

          tar -xzf "${SHELLCHECK_ARCHIVE}"

          sudo install -m755 \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck

          shellcheck --version

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail

          status=0

          while IFS= read -r -d '' file; do
            echo "Checking ${file}"

            if shellcheck --external-sources "$file"; then
              echo "PASS"
            else
              status=1
            fi

            echo
          done < <(find scripts/setup scripts/cleanup -type f -name '*.sh' -print0)

          exit "$status"
